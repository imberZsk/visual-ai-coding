[package]
name = "visual-aicoding"
version = "0.1.0"
description = "可视化管理 Claude Code 与 Codex 的配置工具"
authors = ["imber"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# 仅启用默认能力：所有文件读写、进程调用均通过自定义 invoke 命令实现，
# 不依赖 tauri 的 JS 端 fs/shell/dialog/path API，因此无需额外 allowlist feature
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
