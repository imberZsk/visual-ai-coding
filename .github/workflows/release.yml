name: Release

# 仅在推送 v* 标签时触发正式发布（如 v1.2.3）。
on:
  push:
    tags:
      - 'v*'

# 给内置 GITHUB_TOKEN 写权限：创建 Release / 上传附件需要 contents: write。
permissions:
  contents: write

jobs:
  # 阶段一：各平台只原生打包，产物上传为 artifact，不在并行 job 内创建 Release。
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 某一平台失败不取消另一平台，便于单独重跑。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_args: --win --x64
          - os: macos-latest
            build_args: --mac --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm run build:ui

      - name: Package
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          # 无签名证书时关闭自动发现；产物未签名，首次打开按平台安全提示处理。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
          retention-days: 3

  # 阶段二：单个 job 汇总所有平台产物，一次性创建 GitHub Release，避免并行发布竞态。
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Generate install notes
        run: |
          product_name=$(node -p "const pkg=require('./package.json'); pkg.build?.productName || pkg.productName || pkg.name")
          notes="## 下载与安装"$'\n'
          dmg=$(ls dist-release/*.dmg 2>/dev/null | xargs -n1 basename 2>/dev/null | head -n1 || true)
          if [ -n "$dmg" ]; then
            notes+=$'\n'"### macOS"$'\n'
            notes+="- \`${dmg}\`"$'\n'
            notes+="- 安装包未签名，首次打开会被 Gatekeeper 拦截：请「右键 → 打开」，或执行 \`xattr -cr \"/Applications/${product_name}.app\"\`。"$'\n'
          fi
          setup=$(ls dist-release/*Setup*.exe 2>/dev/null | xargs -n1 basename 2>/dev/null | head -n1 || true)
          portable=$(ls dist-release/*portable*.exe 2>/dev/null | xargs -n1 basename 2>/dev/null | head -n1 || true)
          if [ -n "$setup" ] || [ -n "$portable" ]; then
            notes+=$'\n'"### Windows"$'\n'
            [ -n "$setup" ] && notes+="- \`${setup}\`（安装版）"$'\n'
            [ -n "$portable" ] && notes+="- \`${portable}\`（便携版，免安装）"$'\n'
            notes+="- 安装包未签名，首次运行可能触发 SmartScreen：请点「更多信息 → 仍要运行」。"$'\n'
          fi
          notes+=$'\n'"---"$'\n'
          printf '%s' "$notes" > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_assets=()
          while IFS= read -r file; do
            release_assets+=("$file")
          done < <(find dist-release -type f \( -name '*.dmg' -o -name '*.exe' \) | sort)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "没有找到可发布的安装包"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes
