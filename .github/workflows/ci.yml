name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # 允许在 GitHub 页面手动触发，用于按需验证安装包。
  workflow_dispatch:

jobs:
  # 测试 + 构建 UI：在 macOS 与 Windows 双平台跑，提前发现路径、脚本和 Electron 构建差异。
  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 某一平台失败不取消另一平台，便于同时看到两端结果。
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build UI
        run: pnpm run build:ui

  # 打包 Windows 安装包/便携版：仅在 Windows runner 上原生打包，产物上传为 artifact 供下载验收。
  build-win:
    name: Build Windows package
    runs-on: windows-latest
    needs: test
    # main 已在 PR 阶段完成安装包验证，合并后只保留测试；手动触发仍允许按需打包。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows package
        run: pnpm run dist:win
        env:
          # 无签名证书时关闭自动发现，避免 electron-builder 联网探测拖慢 CI。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  # 打包 macOS DMG：在 macOS runner 上原生打包，产物上传为 artifact 供下载验收。
  build-mac:
    name: Build macOS package
    runs-on: macos-latest
    needs: test
    # main 已在 PR 阶段完成安装包验证，合并后只保留测试；手动触发仍允许按需打包。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS package
        run: pnpm run dist
        env:
          # 无签名证书时关闭自动发现，避免 electron-builder 联网探测拖慢 CI。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: |
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
